name: Build Pocket EVO image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/kernel.yml"
      - "config/**"
      - "rootfs-overlay/**"
      - "scripts/**"
      - "Makefile"
  pull_request:
    paths:
      - ".github/workflows/kernel.yml"
      - "config/**"
      - "rootfs-overlay/**"
      - "scripts/**"
      - "Makefile"

permissions:
  contents: read

env:
  ARCHNEO_DEVICE: ayaneo-pocket-evo

jobs:
  pocket-evo:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out Archneo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify repository metadata
        run: make verify

      - name: Install build and image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            bc \
            bison \
            build-essential \
            cpio \
            curl \
            dosfstools \
            dwarves \
            e2fsprogs \
            fdisk \
            flex \
            gcc-aarch64-linux-gnu \
            gdisk \
            git \
            gnupg \
            kmod \
            libarchive-tools \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            patch \
            parted \
            python3 \
            qemu-user-static \
            rsync \
            xz-utils

      - name: Build Pocket EVO ABL payload
        env:
          ARCHNEO_BUILD_DIR: ${{ github.workspace }}/.ci-build
        run: make kernel

      - name: Assemble Archneo removable image
        env:
          ARCHNEO_BUILD_DIR: ${{ github.workspace }}/.ci-build
          ARCHNEO_CACHE_DIR: ${{ github.workspace }}/.cache
          ARCHNEO_OUT_DIR: ${{ github.workspace }}/out
        run: |
          sudo env \
            ARCHNEO_DEVICE="$ARCHNEO_DEVICE" \
            ARCHNEO_BUILD_DIR="$ARCHNEO_BUILD_DIR" \
            ARCHNEO_CACHE_DIR="$ARCHNEO_CACHE_DIR" \
            ARCHNEO_OUT_DIR="$ARCHNEO_OUT_DIR" \
            ./scripts/build-image.sh

      - name: Upload Pocket EVO image and manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archneo-image-ayaneo-pocket-evo-${{ github.sha }}
          path: out/ayaneo-pocket-evo/
          if-no-files-found: error
          retention-days: 14
